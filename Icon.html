<!DOCTYPE html>
<html>
<body style="background:#111;color:#fff;text-align:center;font-family:sans-serif;padding:30px">
  <h2>KharchBook 512x512 Icon Generator</h2>
  <canvas id="c" width="512" height="512" style="border-radius:60px;margin:20px auto;display:block;max-width:240px;box-shadow:0 10px 30px rgba(0,0,0,0.5)"></canvas>
  <button onclick="dl()" style="padding:14px 28px;background:#087f5b;color:#fff;font-weight:bold;font-size:18px;border:0;border-radius:14px;cursor:pointer">
    ⬇️ Download 512x512 PNG Icon
  </button>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');

    // Dark Rounded Background
    ctx.fillStyle = '#111111';
    ctx.fillRect(0, 0, 512, 512);

    // Green Gradient Card / Note Base
    const grad = ctx.createLinearGradient(80, 80, 432, 432);
    grad.addColorStop(0, '#0ca678');
    grad.addColorStop(1, '#087f5b');
    ctx.fillStyle = grad;
    
    // Draw Note
    ctx.beginPath();
    ctx.roundRect(86, 146, 340, 220, 28);
    ctx.fill();

    // Border
    ctx.strokeStyle = '#20c997';
    ctx.lineWidth = 6;
    ctx.stroke();

    // Center Rupee Circle
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    ctx.arc(256, 256, 55, 0, Math.PI * 2);
    ctx.fill();

    // Rupee Symbol Text
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 64px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('₹', 256, 258);

    // Download Function
    function dl() {
      const link = document.createElement('a');
      link.download = 'icon-512.png';
      link.href = c.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
